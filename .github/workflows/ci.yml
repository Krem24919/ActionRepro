name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated runs on new pushes so CI signal always matches the latest code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - run: npm test
      - name: Smoke test (local fixtures, no network)
        shell: bash
        run: |
          node dist/cli.js doctor
          node dist/cli.js inspect fixtures/logs/npm-fail.log
          node dist/cli.js reproduce fixtures/logs/python-fail.log --out /tmp/actionrepro-smoke
          test -f /tmp/actionrepro-smoke/reproduce.sh
          test -f /tmp/actionrepro-smoke/failure.txt
          test -f /tmp/actionrepro-smoke/environment.txt
          # fail if any obvious fake secret survived
          ! grep -r "ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ123456" /tmp/actionrepro-smoke || (echo "secret leaked!" && exit 1)
