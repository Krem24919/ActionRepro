name: release

# Tag push (v*.*.*) always produces a verified build + GitHub Release.
# Distribution is source-only by design (git tags + GitHub Releases + the
# reusable action): there is no registry publishing step and none is planned.

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - run: npm test

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
