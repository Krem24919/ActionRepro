name: ActionRepro
description: Turn a failed GitHub Actions run into a redacted local reproducibility bundle. No secrets are printed.
author: ActionRepro contributors
branding:
  icon: repeat
  color: green

inputs:
  run-url:
    description: GitHub Actions run URL, e.g. https://github.com/OWNER/REPO/actions/runs/123 (provide this or log-file)
    required: false
    default: ""
  log-file:
    description: Path to a saved failure log file, relative to your checkout (local-file mode, no network). Alternative to run-url.
    required: false
    default: ""
  out:
    description: Output directory for the bundle
    required: false
    default: actionrepro
  run:
    description: Execute reproduce.sh after generating ("true" or "false")
    required: false
    default: "false"
  token:
    description: GitHub token for downloading run logs (defaults to secrets.GITHUB_TOKEN, only used with run-url). Never printed.
    required: false
    default: ${{ github.token }}

outputs:
  out-dir:
    description: Bundle output directory
    value: ${{ steps.repro.outputs.out-dir }}
  summary:
    description: Redacted one-line failure summary
    value: ${{ steps.repro.outputs.summary }}
  repro-command:
    description: Redacted closest repro command
    value: ${{ steps.repro.outputs.repro-command }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 20
    - name: Build actionrepro from source
      shell: bash
      run: |
        set -euo pipefail
        # Self-contained: the pinned action tag carries and builds its own source.
        cd "${{ github.action_path }}"
        npm ci
        npm run build
    - name: Generate redacted repro bundle
      id: repro
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        ACTIONREPRO_URL: ${{ inputs.run-url }}
        ACTIONREPRO_LOG: ${{ inputs.log-file }}
        ACTIONREPRO_OUT: ${{ inputs.out }}
        ACTIONREPRO_RUN: ${{ inputs.run }}
      run: |
        set -euo pipefail
        if [ -n "$ACTIONREPRO_URL" ]; then
          TARGET="$ACTIONREPRO_URL"
        elif [ -n "$ACTIONREPRO_LOG" ]; then
          TARGET="$ACTIONREPRO_LOG"
        else
          echo "actionrepro: provide the 'run-url' or 'log-file' input." >&2
          exit 2
        fi
        # Per-run temp file (RUNNER_TEMP is private to this job, unlike a fixed /tmp path).
        JSON_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/actionrepro.XXXXXX.json")"
        node "${{ github.action_path }}/dist/cli.js" reproduce "$TARGET" --out "$ACTIONREPRO_OUT" --json > "$JSON_FILE"
        # Values are passed through the environment, never spliced into the JavaScript source,
        # so a quote in the input (for example an apostrophe in the out path) cannot break or inject code.
        json_field() {
          ACTIONREPRO_JSON="$JSON_FILE" ACTIONREPRO_DEFAULT="$2" node -e "
            const j = JSON.parse(require('fs').readFileSync(process.env.ACTIONREPRO_JSON, 'utf8'));
            const v = j[process.argv[1]];
            process.stdout.write(String(v ?? process.env.ACTIONREPRO_DEFAULT ?? ''));
          " "$1"
        }
        OUT_DIR="$(json_field outDir "$ACTIONREPRO_OUT")"
        SUMMARY="$(json_field summary "")"
        REPRO="$(json_field reproCommand "")"
        # Multi-line-safe GITHUB_OUTPUT syntax: a newline in a value cannot inject extra outputs.
        {
          for name in out-dir summary repro-command; do
            case "$name" in
              out-dir) value="$OUT_DIR" ;;
              summary) value="$SUMMARY" ;;
              repro-command) value="$REPRO" ;;
            esac
            delim="ACTIONREPRO_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$value" "$delim"
          done
        } >> "$GITHUB_OUTPUT"
        rm -f "$JSON_FILE"
        echo "--- actionrepro summary (redacted) ---"
        # Neutralize workflow-command markers (e.g. ##[error] inside failure
        # text) so the runner never turns our output into phantom annotations.
        echo "${SUMMARY//##\[/## [}"
        echo "repro: ${REPRO//##\[/## [}"
        if [ "$ACTIONREPRO_RUN" = "true" ]; then
          bash "$OUT_DIR/reproduce.sh" || echo "reproduce script exited non-zero (expected when reproducing a failure)"
        fi
